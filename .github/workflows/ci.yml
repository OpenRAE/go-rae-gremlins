name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # The dev merge queue requires PR Gate on each merge group commit.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check model, design, and shrink-only baseline
        env:
          COMPARISON: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before || 'origin/dev' }}
        run: |
          if [ "$COMPARISON" = 0000000000000000000000000000000000000000 ]; then
            COMPARISON=''
          fi
          go run ./tools/architecture -base "$COMPARISON"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # golangci-lint and Go at the versions that mise.toml pins.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install_args: aqua:golangci/golangci-lint go
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Provision Go modules before offline analysis
        run: go mod download
      - run: "python -m pip install --only-binary :all: 'coverage==7.16.0' 'pyyaml==6.0.3'"
      - run: make lint-cover
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: python-coverage.xml
          if-no-files-found: error
          retention-days: 1
      - name: Check lint with the pinned lint comparison
        env:
          LINT_ADOPTION_BASE: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && 'origin/dev' || '' }}
          COMPARISON: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before || 'origin/dev' }}
        run: |
          if [ "$COMPARISON" = 0000000000000000000000000000000000000000 ]; then
            COMPARISON=origin/dev
          fi
          export LINT_BASE="$COMPARISON"
          make lint

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Provision Go modules before offline analysis
        run: go mod download
      - run: make vuln

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make cover
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 1
      # Sonar also reads the Windows profile, which covers the Windows-only files.
      - if: matrix.os == 'windows-latest'
        shell: bash
        run: mv coverage.out coverage-windows.out
      - if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows
          path: coverage-windows.out
          if-no-files-found: error
          retention-days: 1
      # Sonar also reads the macOS profile, which covers the macOS-only files.
      - if: matrix.os == 'macos-latest'
        run: mv coverage.out coverage-macos.out
      - if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-macos
          path: coverage-macos.out
          if-no-files-found: error
          retention-days: 1

  # The hooks of .pre-commit-config.yaml on all files (make policy).
  policy:
    name: Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install_args: aqua:golangci/golangci-lint go
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: "python -m pip install --only-binary :all: 'pre-commit==4.3.0' 'pyyaml==6.0.3'"
      - name: Provision Go modules before offline analysis
        run: go mod download
      - name: Check policy with the pinned lint comparison
        env:
          LINT_ADOPTION_BASE: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && 'origin/dev' || '' }}
          COMPARISON: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before || 'origin/dev' }}
        run: |
          if [ "$COMPARISON" = 0000000000000000000000000000000000000000 ]; then
            COMPARISON=origin/dev
          fi
          export LINT_BASE="$COMPARISON"
          make policy
      # The live dev and main rules must keep every required dev check on the merge queue.
      - name: Check the dev merge queue policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: make merge-queue-policy

  # STE checks on changed Markdown with the pinned doc-tools release.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the verified documentation tools
        run: make docs-tools
      - name: Show that a bad sample fails and its corrected form passes
        run: make docs-samples
      - name: Check the changed Markdown
        env:
          COMPARISON: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before || 'origin/dev' }}
        run: |
          if [ "$COMPARISON" = 0000000000000000000000000000000000000000 ]; then
            COMPARISON=origin/dev
          fi
          make docs-changed DOCS_BASE="$COMPARISON"

  # Proves the cgroup-v2 memory budget stops a runaway allocator. The job fails
  # when the runner lacks an effective memory controller; it never runs unbounded.
  memory:
    name: Memory budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the per-user systemd manager
        # loginctl enable-linger starts the per-user manager for the runner user.
        # It needs no sudo; polkit authorizes a user for their own account.
        run: |
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          loginctl enable-linger "$(id -un)"
          for _ in $(seq 1 30); do
            if systemctl --user show-environment >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
      - name: Prove the memory budget enforcement
        run: |
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          make memcheck

  # Selects Phase E transport tests for a change to the transport or its verification
  # wiring (docs/development/phase-e-design.md). Only PR and merge group runs select a
  # change: a cache entry from dev or main would be readable by fork PRs.
  transport-scope:
    name: Phase E transport scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run }}
      release: ${{ steps.tuple.outputs.release }}
      asset: ${{ steps.tuple.outputs.asset }}
      sha256: ${{ steps.tuple.outputs.sha256 }}
      node: ${{ steps.tuple.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected transport changes
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          # Fork and Dependabot PR runs get no repository secrets.
          NO_SECRETS: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request && "$EVENT_NAME" != merge_group ]]; then
            echo "::notice::$EVENT_NAME runs do not run the Phase E transport tests; the merge queue ran them."
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The comparison base '$BASE' is not a commit SHA."
            exit 1
          fi
          selected=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/ground-control-phase-e.yml | .github/workflows/ground-control-fork-finalization.yml | \
                .github/ground-control/* | .github/workflows/ci.yml | Makefile)
                selected=true ;;
            esac
          done < <(git diff --name-only --no-renames -z "$BASE" HEAD)
          wait $! # A failed comparison fails the step.
          if [[ "$selected" == true && "$NO_SECRETS" == true ]]; then
            echo '::warning::This PR run has no repository secrets. The merge queue runs the Phase E transport tests.'
            selected=false
          fi
          echo "run=$selected" >> "$GITHUB_OUTPUT"
      - name: Read the pinned release from the Phase E workflow
        id: tuple
        if: steps.select.outputs.run == 'true'
        run: |
          set -euo pipefail
          workflow=.github/workflows/ground-control-phase-e.yml
          release="$(yq -e '.jobs.finalize.env.GC_RELEASE' "$workflow")"
          asset="$(yq -e '.jobs.finalize.env.GC_ASSET' "$workflow")"
          sha256="$(yq -e '.jobs.finalize.env.GC_SHA256' "$workflow")"
          node="$(yq -e '[.jobs.finalize.steps[] | select((.uses // "") | test("^actions/setup-node@")) | .with."node-version"] | .[0]' "$workflow")"
          [[ "$release" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$asset" =~ ^grndctl-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$node" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'release=%s\nasset=%s\nsha256=%s\nnode=%s\n' "$release" "$asset" "$sha256" "$node" >> "$GITHUB_OUTPUT"

  # Holds GROUND_CONTROL_READ_TOKEN, so it checks out and runs no candidate code.
  # The tarball goes to the test job through a cache entry with the scope of this
  # PR or merge group. The public repository must not publish it as an artifact.
  transport-release:
    name: Phase E release
    needs: transport-scope
    if: needs.transport-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download and verify the pinned release
        env:
          GH_TOKEN: ${{ secrets.GROUND_CONTROL_READ_TOKEN }}
          GC_RELEASE: ${{ needs.transport-scope.outputs.release }}
          GC_ASSET: ${{ needs.transport-scope.outputs.asset }}
          GC_SHA256: ${{ needs.transport-scope.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Set GROUND_CONTROL_READ_TOKEN with read-only access to the Ground Control release repository.'
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/ground-control"
          gh release download "$GC_RELEASE" --repo autarchy-ai/Ground-Control \
            --pattern "$GC_ASSET" --dir "$RUNNER_TEMP/ground-control"
          cd "$RUNNER_TEMP/ground-control"
          printf '%s  %s\n' "$GC_SHA256" "$GC_ASSET" | sha256sum --check --status
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ground-control
          key: ground-control-release-${{ needs.transport-scope.outputs.sha256 }}

  # Runs the candidate harness and workflow shell without secrets.
  transport:
    name: Phase E transport tests
    needs: [transport-scope, transport-release]
    if: needs.transport-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.transport-scope.outputs.node }}
          package-manager-cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ground-control
          key: ground-control-release-${{ needs.transport-scope.outputs.sha256 }}
          fail-on-cache-miss: true
      - name: Verify and install the locked utility
        env:
          GC_ASSET: ${{ needs.transport-scope.outputs.asset }}
          GC_SHA256: ${{ needs.transport-scope.outputs.sha256 }}
        run: |
          set -euo pipefail
          install="$RUNNER_TEMP/ground-control"
          cp .github/ground-control/package.json .github/ground-control/package-lock.json "$install/"
          cd "$install"
          printf '%s  %s\n' "$GC_SHA256" "$GC_ASSET" | sha256sum --check --status
          npm ci --ignore-scripts --omit=dev --no-audit --no-fund --userconfig=/dev/null \
            --globalconfig="$install/global.npmrc" --cache="$RUNNER_TEMP/ground-control-cache"
      - name: Run the Phase E transport harness
        env:
          GROUND_CONTROL_TEST_ROOT: ${{ runner.temp }}/ground-control/node_modules/grndctl
        run: make phase-e-test

  # Validates coverage reports and scanner settings in a secret-free job.
  # The token-bearing scan runs separately. Secrets are not available to
  # pull requests from other repositories, so those skip the Sonar jobs.
  sonar-admission:
    name: Sonar admission
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pull-requests: read # read the queued pull request on a merge group
    outputs:
      args: ${{ steps.target.outputs.args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-windows
          path: coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-macos
          path: coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-coverage
          path: coverage
      - name: Require exactly the Linux Go, Windows Go, macOS Go, and Python coverage reports
        run: bash scripts/check-coverage.sh
      # The scanner reads sonar-project.properties from the candidate. Reject
      # any setting outside this list and any path outside the checkout.
      - name: Allow only reviewed Sonar settings
        run: |
          settings=sonar-project.properties
          allowed='^sonar\.(projectKey|organization|sources|exclusions|tests|test\.inclusions|test\.exclusions|go\.coverage\.reportPaths|python\.coverage\.reportPaths)=[A-Za-z0-9_./*,-]*$'
          test -f "$settings"
          if grep -n '[\]' "$settings"; then
            echo "::error file=$settings::Backslash escapes and continuations are not allowed"
            exit 1
          fi
          if grep -nvE -e "$allowed" -e '^#' -e '^$' "$settings"; then
            echo "::error file=$settings::Unreviewed Sonar setting"
            exit 1
          fi
          if grep -nE -e '=/|,/' -e '\.\.' "$settings"; then
            echo "::error file=$settings::Absolute and parent paths are not allowed"
            exit 1
          fi
          if grep -vE -e '^#' -e '^$' "$settings" | cut -d= -f1 | sort | uniq -d | grep .; then
            echo "::error file=$settings::Duplicate Sonar setting"
            exit 1
          fi
      # SonarCloud has no merge queue support. A merge group runs the pull
      # request analysis and quality gate of the queued pull request against
      # dev on the merge group commit. An unexpected merge group ref fails.
      - name: Resolve the analysis target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != merge_group ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^refs/heads/gh-readonly-queue/dev/pr-([0-9]+)-[0-9a-f]{40}$'
          if [[ ! "$QUEUE_REF" =~ $pattern ]]; then
            echo "::error::Unexpected merge group ref '$QUEUE_REF'"
            exit 1
          fi
          number="${BASH_REMATCH[1]}"
          branch="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" \
            --jq 'if .base.ref == "dev" then .head.ref else error("not a dev pull request") end')"
          if [[ ! "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Queued pull request branch '$branch' is not a plain ref name"
            exit 1
          fi
          printf 'args=-Dsonar.pullrequest.key=%s -Dsonar.pullrequest.branch=%s -Dsonar.pullrequest.base=dev\n' \
            "$number" "$branch" >> "$GITHUB_OUTPUT"

  # Holds SONAR_TOKEN, so it runs no commands.
  sonar:
    name: SonarCloud
    needs: sonar-admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-windows
          path: coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-macos
          path: coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-coverage
          path: coverage
      - name: Analyze and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true ${{ needs.sonar-admission.outputs.args }}

  gate:
    name: PR Gate
    if: always()
    needs: [architecture, lint, vuln, docs, test, policy, memory, sonar, transport-scope, transport]
    runs-on: ubuntu-latest
    steps:
      - name: Require architecture, lint, vulnerability scan, docs, tests, policy, memory, SonarCloud, and transport tests
        env:
          TRANSPORT_SCOPE_RESULT: ${{ needs.transport-scope.result }}
          TRANSPORT_SELECTED: ${{ needs.transport-scope.outputs.run }}
          TRANSPORT_RESULT: ${{ needs.transport.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          VULN_RESULT: ${{ needs.vuln.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          TEST_RESULT: ${{ needs.test.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          MEMORY_RESULT: ${{ needs.memory.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          FOREIGN_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          test "$ARCHITECTURE_RESULT" = success
          test "$LINT_RESULT" = success
          test "$VULN_RESULT" = success
          test "$DOCS_RESULT" = success
          test "$TEST_RESULT" = success
          test "$POLICY_RESULT" = success
          test "$MEMORY_RESULT" = success
          if [ "$FOREIGN_PR" = true ]; then
            test "$SONAR_RESULT" = skipped
          else
            test "$SONAR_RESULT" = success
          fi
          test "$TRANSPORT_SCOPE_RESULT" = success
          if [ "$TRANSPORT_SELECTED" = true ]; then
            test "$TRANSPORT_RESULT" = success
          else
            test "$TRANSPORT_RESULT" = skipped
          fi
