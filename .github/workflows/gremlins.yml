name: Gremlins

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # Mutation testing of the repository with the Gremlins of the same commit.
  gremlins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Start the per-user systemd manager
        # loginctl enable-linger starts the per-user manager for the runner user.
        # It needs no sudo; polkit authorizes a user for their own account.
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          loginctl enable-linger "$(id -un)"
          for _ in $(seq 1 30); do
            if systemctl --user show-environment >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
      - name: Run mutation testing inside a memory budget
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          scripts/run-bounded.sh --budget 10G -- go run ./cmd/gremlins unleash --silent
