name: Repository policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    name: Configuration and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install repository check runner
        run: python -m pip install pre-commit==4.3.0
      - name: Check configuration and tracked files
        run: make policy
      - name: Scan Git history for secrets
        run: pre-commit run gitleaks-history --hook-stage manual --all-files
