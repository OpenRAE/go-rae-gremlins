name: Repository policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    name: Configuration and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install repository check runner
        run: python -m pip install pre-commit==4.3.0
      # make policy runs the pre-commit-stage hooks. The CI Lint job owns golangci-lint.
      - name: Check configuration and tracked files
        run: make policy
      - name: Scan Git history for secrets
        run: pre-commit run gitleaks-history --hook-stage manual --all-files
